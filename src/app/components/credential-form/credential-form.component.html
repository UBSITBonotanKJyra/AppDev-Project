<div class="form-container">
  <h3>Add New Credential</h3>
  <form (submit)="submit()">
    <input [(ngModel)]="newEntry.siteName" name="site" placeholder="Site Name" required>
    <input [(ngModel)]="newEntry.username" name="user" placeholder="Username" required>
    <input [(ngModel)]="newEntry.password" name="pass" type="password" placeholder="Password" required>
    
    <select [(ngModel)]="newEntry.category" name="cat">
      <option value="Personal">Personal</option>
      <option value="Work">Work</option>
      <option value="Banking">Banking</option>
      <option value="Social">Social</option>
      <option value="Business">Business</option>
    </select>

    <button type="submit" class="save-btn">Save to Vault</button>
  </form>
</div>
